<!DOCTYPE html>
<html lang="es-419">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía Mítica Plus - Matriz Táctica y Contramedidas M+</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado OK'))
                    .catch(err => console.error('Error en Service Worker', err));
            });
        }
    </script>

    <style>
        /* Estilo Companion App / Blizzard Classic Dark UI */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0c0a09; 
            color: #d6d3d1; 
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        
        /* Paneles Estilo Companion App */
        .companion-panel {
            background-color: #1a1614;
            border: 2px solid #57534e;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.6);
        }
        .companion-header {
            background: linear-gradient(to bottom, #292524 0%, #1c1917 100%);
            border-bottom: 2px solid #78716c;
            color: #facc15;
            text-shadow: 1px 1px 2px #000;
        }

        /* Botón de Mazmorra 1:1 con Fondo de Imagen y Overlay Oscuro */
        .dungeon-card {
            background-size: cover;
            background-position: center;
            position: relative;
            border: 2px solid #57534e;
            transition: all 0.25s ease;
        }
        .dungeon-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(12, 10, 9, 0.95) 0%, rgba(12, 10, 9, 0.75) 50%, rgba(12, 10, 9, 0.4) 100%);
            border-radius: inherit;
            z-index: 1;
        }
        .dungeon-card > * {
            position: relative;
            z-index: 2;
        }
        .dungeon-card:hover {
            border-color: #facc15;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9);
        }

        /* Transiciones orgánicas de vista */
        .view-transition {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        .fade-out-slide {
            opacity: 0;
            transform: translateX(30px);
        }
        .fade-in-slide {
            opacity: 1;
            transform: translateX(0);
        }

        /* Botón Clásico Blizzard: Rojo en Relieve con esquinas a 45 grados (Chamfered) */
        .blizzard-btn {
            background: linear-gradient(to bottom, #ef4444 0%, #dc2626 50%, #991b1b 100%);
            border: 2px solid #78716c;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 4px 8px rgba(0, 0, 0, 0.6);
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
            color: #facc15;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            text-shadow: 1px 1px 2px #000;
            transition: all 0.2s ease;
        }
        .blizzard-btn:hover {
            background: linear-gradient(to bottom, #f87171 0%, #ef4444 50%, #b91c1c 100%);
            filter: brightness(1.15);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 6px 12px rgba(220, 38, 38, 0.4);
        }
        .blizzard-btn:active {
            transform: translateY(1px);
        }

        /* Pestañas de Navegación */
        .tab-btn {
            color: #a8a29e;
            background-color: #141210;
            border: 1px solid #292524;
        }
        .tab-btn:hover {
            color: #facc15;
            background-color: #1c1917;
        }
        .tab-btn.active { 
            border-bottom: 3px solid #facc15; 
            color: #facc15; 
            font-weight: 700; 
            background-color: #292524; 
            border-top: 1px solid #78716c;
        }

        /* Scrollbars personalizados estilo piedra */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0c0a09; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #44403c; border-radius: 4px; border: 1px solid #57534e; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #78716c; }
        
        .chart-container { position: relative; width: 100%; max-width: 650px; margin-left: auto; margin-right: auto; height: 320px; max-height: 380px; }
        @media (min-width: 768px) { .chart-container { height: 350px; } }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- TOP HEADER / NAV CON LOGOTIPO DE PIEDRA ANGULAR -->
    <header class="bg-[#141210] text-stone-100 border-b-2 border-[#57534e] sticky top-0 z-50 shadow-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <!-- Logotipo SVG: Piedra Angular Mítica (Keystone) -->
                    <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-amber-700 via-orange-600 to-amber-400 flex items-center justify-center shadow-lg border-2 border-amber-300/60 relative overflow-hidden">
                        <svg class="w-6 h-6 text-stone-950 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <div class="absolute inset-0 bg-white/10 animate-pulse"></div>
                    </div>
                    <div>
                        <h1 class="font-cinzel text-base sm:text-lg font-bold tracking-wide text-amber-400 drop-shadow">GUÍA MÍTICA PLUS</h1>
                        <p class="text-[10px] text-stone-400 hidden sm:block">Matriz Táctica & Contramedidas M+</p>
                    </div>
                </div>
                
                <!-- Main Navigation Tabs -->
                <nav class="hidden md:flex space-x-1">
                    <button onclick="switchTab('tab-dungeons')" id="nav-tab-dungeons" class="tab-btn active px-3 py-2 rounded-t-lg text-xs lg:text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fa-solid fa-dungeon text-amber-500"></i> Guía de Mazmorras
                    </button>
                    <button onclick="switchTab('tab-overview')" id="nav-tab-overview" class="tab-btn px-3 py-2 rounded-t-lg text-xs lg:text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-amber-500"></i> Ecosistema M+
                    </button>
                    <button onclick="switchTab('tab-matrix')" id="nav-tab-matrix" class="tab-btn px-3 py-2 rounded-t-lg text-xs lg:text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fa-solid fa-table-list text-amber-500"></i> Matriz de Clases
                    </button>
                    <button onclick="switchTab('tab-analyzer')" id="nav-tab-analyzer" class="tab-btn px-3 py-2 rounded-t-lg text-xs lg:text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-amber-500"></i> Cobertura de Grupo
                    </button>
                    <button onclick="switchTab('tab-calculator')" id="nav-tab-calculator" class="tab-btn px-3 py-2 rounded-t-lg text-xs lg:text-sm font-medium transition-all flex items-center gap-2">
                        <i class="fa-solid fa-calculator text-amber-500"></i> Calculadora M+
                    </button>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button id="mobile-menu-btn" onclick="toggleMobileMenu()" class="text-stone-300 hover:text-white p-2">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Dropdown with Dungeons Submenu -->
        <div id="mobile-menu" class="hidden md:hidden bg-[#141210] border-t border-stone-800 px-4 pt-2 pb-4 space-y-2">
            <button onclick="switchTab('tab-dungeons'); toggleMobileMenu();" class="w-full text-left px-3 py-2 text-stone-200 hover:bg-stone-900 rounded flex items-center gap-2 font-bold text-amber-400">
                <i class="fa-solid fa-dungeon"></i> Guía de Mazmorras
            </button>
            
            <!-- Submenu de Mazmorras en Móvil -->
            <div class="pl-4 space-y-1 border-l-2 border-amber-600/50 my-1">
                <p class="text-[10px] uppercase font-bold text-amber-500 tracking-wider">Seleccionar Calabozo:</p>
                <div id="mobile-dungeon-list" class="space-y-1">
                    <!-- Inyectado por JS -->
                </div>
            </div>

            <button onclick="switchTab('tab-overview'); toggleMobileMenu();" class="w-full text-left px-3 py-2 text-stone-200 hover:bg-stone-900 rounded flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-amber-500"></i> Ecosistema M+
            </button>
            <button onclick="switchTab('tab-matrix'); toggleMobileMenu();" class="w-full text-left px-3 py-2 text-stone-200 hover:bg-stone-900 rounded flex items-center gap-2">
                <i class="fa-solid fa-table-list text-amber-500"></i> Matriz de Clases
            </button>
            <button onclick="switchTab('tab-analyzer'); toggleMobileMenu();" class="w-full text-left px-3 py-2 text-stone-200 hover:bg-stone-900 rounded flex items-center gap-2">
                <i class="fa-solid fa-users-gear text-amber-500"></i> Cobertura de Grupo
            </button>
            <button onclick="switchTab('tab-calculator'); toggleMobileMenu();" class="w-full text-left px-3 py-2 text-stone-200 hover:bg-stone-900 rounded flex items-center gap-2">
                <i class="fa-solid fa-calculator text-amber-500"></i> Calculadora M+
            </button>
        </div>
    </header>
