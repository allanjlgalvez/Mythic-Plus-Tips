<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../vendor/fonts/fonts.css">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1024px;height:500px;overflow:hidden;background:#0c0a09;font-family:Inter,sans-serif;color:#e7e5e4;position:relative}
  .art{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);opacity:.55}
  .art div{background-size:cover;background-position:center}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,#0c0a09 0%,rgba(12,10,9,.92) 45%,rgba(12,10,9,.35) 100%)}
  .content{position:absolute;left:64px;top:0;bottom:0;display:flex;align-items:center;gap:36px}
  img{width:190px;height:190px;border-radius:40px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  h1{font-family:Cinzel,serif;font-weight:800;font-size:64px;line-height:1.02;color:#fbbf24;text-shadow:0 2px 12px rgba(0,0,0,.8)}
  p{font-size:26px;margin-top:14px;color:#e7e5e4;max-width:520px;line-height:1.3}
</style></head><body>
<div class="art">
  <div style="background-image:url(../images/altar-of-fangs.webp)"></div><div style="background-image:url(../images/den-of-nalorakk.webp)"></div>
  <div style="background-image:url(../images/kings-rest.webp)"></div><div style="background-image:url(../images/murder-row.webp)"></div>
  <div style="background-image:url(../images/temple-of-sethraliss.webp)"></div><div style="background-image:url(../images/voidscar-arena.webp)"></div>
  <div style="background-image:url(../images/ruby-life-pools.webp)"></div><div style="background-image:url(../images/the-blinding-vale.webp)"></div>
</div>
<div class="shade"></div>
<div class="content">
  <img src="emblema.png" alt="">
  <div><h1>Guía Mítica Plus</h1><p>Guías de mazmorras M+ en español: jefes, interrupciones, disipaciones y ruta.</p></div>
</div>
</body></html>
