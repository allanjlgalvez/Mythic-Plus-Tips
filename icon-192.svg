<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo base con borde biselado -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="180" height="180" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.7" />
  <rect x="12" y="12" width="168" height="168" rx="24" fill="none" stroke="#ea580c" stroke-width="1" stroke-opacity="0.3" />

  <!-- Acento decorativo central (Gemas/Runas de Piedra Angular) -->
  <polygon points="96,24 104,36 96,48 88,36" fill="url(#goldGrad)" filter="url(#glow)" />
  <polygon points="96,144 104,156 96,168 88,156" fill="url(#goldGrad)" opacity="0.6" />

  <!-- Tipografía Logotipo M+ -->
  <g text-anchor="middle" font-family="'Cinzel', 'Cinzel Decorative', 'Georgia', serif" font-weight="900">
    <!-- Letra M -->
    <text x="82" y="118" font-size="78" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="-2">M</text>
    <!-- Símbolo + Estilizado -->
    <text x="134" y="100" font-size="52" fill="#f97316" font-family="'Segoe UI', sans-serif" font-weight="800">+</text>
  </g>

  <!-- Subtexto Táctico -->
  <text x="96" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#a8a29e" letter-spacing="3">MIDNIGHT</text>
</svg>
